<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyxell Launcher - Comentarios</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <a href="index.html" class="logo">NYXELL</a>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="noticias.html">Noticias</a>
            <a href="equipo.html">Equipo</a>
            <a href="download.html">Descargar</a>
            <a href="soporte.html">Soporte</a>
            <a href="politica.html">Política y Privacidad</a>
            <a href="comentarios.html" class="active">Comentarios</a>
        </nav>
    </header>

    <main>
        <h1 class="section-title">Deja tu Comentario</h1>
        
        <form id="comment-form">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>
            </div>
            
            <div class="form-group">
                <label>Estrellas:</label>
                <div class="rating">
                    <input type="radio" id="star5" name="estrellas" value="5" required><label for="star5">★</label>
                    <input type="radio" id="star4" name="estrellas" value="4"><label for="star4">★</label>
                    <input type="radio" id="star3" name="estrellas" value="3"><label for="star3">★</label>
                    <input type="radio" id="star2" name="estrellas" value="2"><label for="star2">★</label>
                    <input type="radio" id="star1" name="estrellas" value="1"><label for="star1">★</label>
                </div>
            </div>

            <div class="form-group">
                <label for="opinion">Opinión:</label>
                <textarea id="opinion" rows="4" required></textarea>
            </div>

            <button type="submit" class="btn">Enviar Comentario</button>
        </form>

        <h2 class="section-title">Comentarios de la Comunidad</h2>
        <div id="comentarios-container"></div>
    </main>

    <footer>
        &copy; Nyxell Launcher. Todos los derechos reservados.
    </footer>

    <script src="comentarios.js"></script>
</body>
</html>
